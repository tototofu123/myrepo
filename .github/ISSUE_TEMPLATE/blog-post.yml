name: 📝 New Blog Post
description: Create a new blog post (triggered by the Perplexity blog skill)
title: "[blog] "
labels: ["blog"]
body:
  - type: input
    id: title
    attributes:
      label: Post Title
      placeholder: My Awesome Post
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Slug
      description: URL-friendly identifier, e.g. my-awesome-post
      placeholder: my-awesome-post
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: Publication date in YYYY-MM-DD format
      placeholder: "2026-05-23"
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-sentence description
      placeholder: A short description of the post.
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated list of tags
      placeholder: tech, engineering
  - type: textarea
    id: content
    attributes:
      label: Content (Markdown)
      description: The full body of the blog post in Markdown.
      render: markdown
    validations:
      required: true
