name: Create Blog Post from Issue

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  build-blog:
    # Only run when the issue has the 'blog' label AND title starts with '[blog]'
    if: |
      contains(github.event.issue.labels.*.name, 'blog') &&
      startsWith(github.event.issue.title, '[blog]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse issue body and generate blog page
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node .github/scripts/generate-blog.js

      - name: Build site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true

      - name: Comment on issue with result
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.ISSUE_BODY || '';
            const slugMatch = body.match(/^slug:\s*"?([\w-]+)"?/m);
            const slug = slugMatch ? slugMatch[1] : 'unknown';
            const cname = require('fs').existsSync('CNAME')
              ? require('fs').readFileSync('CNAME', 'utf8').trim()
              : `${context.repo.owner}.github.io/${context.repo.repo}`;
            const url = `https://${cname}/blogs/${slug}/`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Blog post published!\n\n🔗 ${url}\n\nThe page was built from this issue and deployed to GitHub Pages.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
