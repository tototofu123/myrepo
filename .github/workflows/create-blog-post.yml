name: Create Blog Post from Issue

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  build-blog:
    # Only run when the issue has the 'blog' label AND title starts with '[blog]'
    if: |
      contains(github.event.issue.labels.*.name, 'blog') &&
      startsWith(github.event.issue.title, '[blog]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Parse issue body and generate blog page
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node .github/scripts/generate-blog.js

      - name: Commit generated blog files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/blogs/
          git diff --quiet --cached || git commit -m "blog: add post from issue ${{ github.event.issue.number }}"
          git push origin main

      - name: Comment on issue with result
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.ISSUE_BODY || '';
            const slugMatch = body.match(/^slug:\s*"?([\w-]+)"?/m);
            const slug = slugMatch ? slugMatch[1] : 'unknown';
            const cname = require('fs').existsSync('CNAME')
              ? require('fs').readFileSync('CNAME', 'utf8').trim()
              : `${context.repo.owner}.github.io/${context.repo.repo}`;
            const url = `https://${cname}/blogs/${slug}/`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `~ Deploying! Blog post will be live at:\n\n> ${url}\n\nThe Vite build is running now (triggered by the commit to main). It should be live in ~1 minute.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
