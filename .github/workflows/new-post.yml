name: New Blog Post from Issue

on:
  issues:
    types: [labeled]

jobs:
  create-post:
    if: github.event.label.name == 'blog-post'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate post HTML
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_DATE: ${{ github.event.issue.created_at }}
        run: |
          mkdir -p public/posts
          python3 .github/scripts/generate_post.py

      - name: Commit post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/posts/
          git commit -m "blog: add post from issue #${{ github.event.issue.number }} - ${{ github.event.issue.title }}" || echo "Nothing to commit"
          git push
