          echo "Generated: $FILENAME"

          # Update posts index JSON
          python3 << 'PYEOF'
import json, os, re

index_path = 'public/posts/index.json'
posts = []

if os.path.exists(index_path):
    with open(index_path) as f:
        posts = json.load(f)

slug = os.environ['ISSUE_TITLE'].lower()
slug = re.sub(r'[^a-z0-9]+', '-', slug).strip('-')
date = os.environ['ISSUE_DATE'][:10]
title = os.environ['ISSUE_TITLE']
number = os.environ['ISSUE_NUMBER']

# Remove existing entry for same slug if re-running
posts = [p for p in posts if p.get('slug') != slug]
posts.insert(0, {'slug': slug, 'title': title, 'date': date, 'issue': number})

with open(index_path, 'w') as f:
    json.dump(posts, f, indent=2)
print(f'Index updated: {len(posts)} posts')
PYEOF

      - name: Commit post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/posts/
          git commit -m "blog: add post from issue #${{ github.event.issue.number }} - ${{ github.event.issue.title }}" || echo "Nothing to commit"
          git push
