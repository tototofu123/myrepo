name: New Blog Post from Issue

on:
  issues:
    types: [labeled]

jobs:
  create-post:
    if: github.event.label.name == 'blog-post'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-markdown
        run: pip install markdown

      - name: Generate post
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_DATE: ${{ github.event.issue.created_at }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          mkdir -p public/posts
          python3 .github/scripts/generate_post.py

      - name: Commit post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/posts/
          git diff --cached --quiet || git commit -m "blog: add post from issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const slug = process.env.ISSUE_TITLE
              .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Post published! Live at: https://repo.lai.codes/blog/${slug}`
            });
          env:
            ISSUE_TITLE: ${{ github.event.issue.title }}
