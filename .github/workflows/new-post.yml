name: New Blog Post from Issue

on:
  issues:
    types: [labeled]

jobs:
  create-post:
    if: github.event.label.name == 'blog-post'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate post HTML
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_DATE: ${{ github.event.issue.created_at }}
        run: |
          mkdir -p public/posts

          # Slug from title
          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          DATE=$(echo "$ISSUE_DATE" | cut -c1-10)
          FILENAME="public/posts/${SLUG}.html"

          # Escape body for embedding
          BODY_ESCAPED=$(echo "$ISSUE_BODY" | python3 -c "
import sys, html, re
body = sys.stdin.read()

# Convert markdown-ish to HTML
def md_to_html(text):
    lines = text.split('\n')
    out = []
    in_code = False
    for line in lines:
        if line.startswith('\`\`\`'):
            if not in_code:
                out.append('<pre><code>')
                in_code = True
            else:
                out.append('</code></pre>')
                in_code = False
        elif in_code:
            out.append(html.escape(line))
        elif line.startswith('### '):
            out.append(f'<h3>{html.escape(line[4:])}</h3>')
        elif line.startswith('## '):
            out.append(f'<h2>{html.escape(line[3:])}</h2>')
        elif line.startswith('# '):
            out.append(f'<h1>{html.escape(line[2:])}</h1>')
        elif line.startswith('- ') or line.startswith('* '):
            out.append(f'<li>{html.escape(line[2:])}</li>')
        elif line.strip() == '':
            out.append('<br>')
        else:
            # inline bold/italic/code
            l = html.escape(line)
            l = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', l)
            l = re.sub(r'\*(.+?)\*', r'<em>\1</em>', l)
            l = re.sub(r'\`(.+?)\`', r'<code>\1</code>', l)
            out.append(f'<p>{l}</p>')
    return '\n'.join(out)

print(md_to_html(body))
")

