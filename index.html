<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repo Showcase | lai.codes</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #ededed;
            --accent: #0070f3;
            --glass: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 2rem;
            border-radius: 16px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
        }
        h1 { font-size: 1.5rem; letter-spacing: -0.05rem; }
        p { color: #888; font-size: 0.9rem; }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>repo.lai.codes</h1>
        <p><span class="status-dot"></span>Automated Repository Showcase Incoming</p>
        <p style="font-size: 0.7rem; margin-top: 20px;">Built with GitHub Actions & DNS Subdomains</p>
    </div>
</body>
</html>
